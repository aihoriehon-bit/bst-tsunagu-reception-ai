<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>つなぐちゃん 受付動作プレビュー</title>
    <link rel="stylesheet" href="../wide-desk/motion-preview.css?v=20260831-voice-credit-1" />
  </head>
  <body>
    <main class="preview-stage">
      <div id="scene" class="scene" aria-label="受付キャラクターの動作確認"></div>

      <header class="preview-header">
        <div>
          <p class="eyebrow">動きだけ確認</p>
          <h1 id="actionLabel">読み込み中…</h1>
        </div>
        <p class="hint">正面固定</p>
      </header>

      <aside class="speech-panel" aria-label="セリフの音声テスト">
        <div class="speech-heading">
          <strong>セリフテスト</strong>
          <span>ボタンで音声再生</span>
        </div>
        <div id="speechButtons" class="speech-buttons">
          <button type="button" data-speech="welcome">いらっしゃいませ</button>
          <button type="button" data-speech="morning">朝の受付案内</button>
          <button type="button" data-speech="visitor">ご用件の確認</button>
          <button type="button" data-speech="calling">担当者を呼ぶ</button>
          <button type="button" data-speech="goodbye">お見送り</button>
        </div>
        <p id="speechStatus" class="speech-status" aria-live="polite">再生したいセリフを選んでください</p>
        <p class="voice-credit">VOICEVOX:春日部つむぎ</p>
      </aside>

      <section id="controls" class="controls" aria-label="動作選択">
        <button class="sequence-button is-active" type="button" data-sequence>
          <span class="play-mark">▶</span>
          一連再生
        </button>
        <div class="divider" aria-hidden="true"></div>
        <button type="button" data-action="deskWork">PC作業</button>
        <button type="button" data-action="standUp">立ち上がり</button>
        <button type="button" data-action="standIdle">立ち待機</button>
        <button type="button" data-action="bow">お辞儀</button>
        <button type="button" data-action="sitDown">座り直し</button>
      </section>

      <div id="loading" class="loading" role="status">
        <div class="loader" aria-hidden="true"></div>
        <strong>キャラクターを読み込んでいます</strong>
        <span id="loadingDetail">0%</span>
      </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="../wide-desk/motion-preview.js?v=20260831-speech-motion-1"></script>
  </body>
</html>
