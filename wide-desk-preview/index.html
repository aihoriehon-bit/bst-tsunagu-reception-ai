<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>つなぐちゃん 受付動作プレビュー</title>
    <link rel="stylesheet" href="../wide-desk/motion-preview.css?v=20260909-recognition-1" />
  </head>
  <body>
    <main class="preview-stage">
      <div id="scene" class="scene" aria-label="受付キャラクターの動作確認"></div>

      <header class="hud-top">
        <section id="cameraPanel" class="camera-panel" aria-label="来客センサーカメラ">
          <div id="cameraView" class="camera-view">
            <video id="cameraPreview" autoplay muted playsinline></video>
            <span id="cameraFaceMark" class="camera-face-mark" hidden>●</span>
          </div>
          <div class="camera-info">
            <strong>来客センサー</strong>
            <span id="cameraStatus">カメラ起動中…</span>
            <span id="visitorStatus">来客なし</span>
            <span class="camera-note">映像は来客検知と顔・制服の照合に使用し、保存・送信しません。登録した特徴量と名前はこのブラウザ内に保存します。</span>
          </div>
          <div class="camera-buttons">
            <button id="cameraToggle" type="button">カメラ停止</button>
            <button id="visitorTest" type="button">来客テスト</button>
            <button id="employeeDemoToggle" type="button">社員デモ</button>
          </div>
        </section>

        <div class="hud-right">
          <button id="sensorPanelToggle" class="panel-toggle is-active" type="button" aria-controls="cameraPanel" aria-pressed="true">センサーON</button>
          <span id="stateChip" class="state-chip" data-state="working">作業中</span>
          <span id="clockText" aria-label="現在時刻">--:--</span>
          <button id="soundToggle" class="icon-button is-active" type="button" aria-label="音声を停止" title="音声を停止"><span aria-hidden="true">♪</span></button>
        </div>

        <h1 id="actionLabel" class="sr-only">読み込み中…</h1>
      </header>

      <aside class="speech-panel" hidden aria-label="セリフの音声テスト">
        <div class="speech-heading">
          <strong>セリフテスト</strong>
          <span>ボタンで音声再生</span>
        </div>
        <div id="speechButtons" class="speech-buttons">
          <button type="button" data-speech="welcome">いらっしゃいませ</button>
          <button type="button" data-speech="morning">受付案内</button>
          <button type="button" data-speech="visitor">ご用件の確認</button>
          <button type="button" data-speech="calling">担当者を呼ぶ</button>
          <button type="button" data-speech="goodbye">お見送り</button>
        </div>
        <div class="speech-tools">
          <label><input id="autoSpeech" type="checkbox" checked />待機中も話す</label>
        </div>
        <details class="extra-speech">
          <summary>追加セリフ・呼びかけ相手</summary>
          <label for="extraSpeechSelect">試したいセリフ</label>
          <div class="extra-speech-row">
            <select id="extraSpeechSelect"></select>
            <button id="extraSpeechPlay" type="button">再生</button>
          </div>
          <label for="visitorProfile">カメラ検知時の呼びかけ相手</label>
          <select id="visitorProfile">
            <option value="guest">通常のお客様（時間帯別）</option>
            <option value="employeeSato">佐藤さん</option>
            <option value="employeeTanaka">田中さん</option>
            <option value="fukuda">福田さん（時間帯別）</option>
            <option value="yamato">ヤマトの方</option>
          </select>
          <p>相手は手動で選択します。顔から名前を判別する機能ではありません。</p>
        </details>
        <p id="speechStatus" class="speech-status" aria-live="polite">再生したいセリフを選んでください</p>
      </aside>

      <section id="controls" class="controls" hidden aria-label="動作選択">
        <button class="sequence-button is-active" type="button" data-sequence>
          <span class="play-mark">▶</span>
          一連再生
        </button>
        <div class="divider" aria-hidden="true"></div>
        <button type="button" data-action="deskWork">PC作業</button>
        <button type="button" data-action="standUp">立ち上がり</button>
        <button type="button" data-action="standIdle">立ち待機</button>
        <button type="button" data-action="bow">お辞儀</button>
        <button type="button" data-action="sitDown">座り直し</button>
      </section>

      <p class="voice-credit-fixed">VOICEVOX:春日部つむぎ</p>

      <div id="loading" class="loading" role="status">
        <div class="loader" aria-hidden="true"></div>
        <strong>キャラクターを読み込んでいます</strong>
        <span id="loadingDetail">0%</span>
      </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="../wide-desk/motion-preview.js?v=20260909-recognition-1"></script>
  </body>
</html>
